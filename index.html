<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Hassan Ssenyonjo</title>
  <meta name="description" content="Hassan Ssenyonjo — aspiring web developer, AI enthusiast and future tech entrepreneur.">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <!-- Lock screen -->
  <section id="lock" class="lock">
    <div class="lock-bg" id="lockBg"></div>
    <div class="lock-top">
      <div class="lock-date" id="lockDate"></div>
      <div class="lock-time" id="lockTime"></div>
    </div>
    <div class="lock-note" id="lockNote">
      <div class="lock-note-head"><span class="lock-note-app" id="lockNoteApp"></span><span>now</span></div>
      <div class="lock-note-title" id="lockNoteTitle"></div>
      <div class="lock-note-text" id="lockNoteText"></div>
    </div>
    <span class="lock-act left" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M8 2h8v4l-2 3v12a1 1 0 0 1-1 1h-2a1 1 0 0 1-1-1V9L8 6V2Z"/><path d="M8 6h8M12 13v2"/></svg>
    </span>
    <span class="lock-act right" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M3 8a2 2 0 0 1 2-2h2.5L9 4h6l1.5 2H19a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8Z"/><circle cx="12" cy="13" r="3.6"/></svg>
    </span>
    <button class="lock-hint" id="unlockBtn">
      <span class="lock-bar"></span>
      Swipe up to unlock
    </button>
  </section>

  <!-- Desktop -->
  <main id="desktop" class="desktop" aria-hidden="true">
    <div class="wallpaper" id="wallpaper"></div>

    <header class="menubar">
      <div class="menu-left">
        <strong id="menuName"></strong>
        <span class="menu-hide">Finder</span>
        <span class="menu-hide">File</span>
        <span class="menu-hide">Edit</span>
        <span class="menu-hide">View</span>
        <span class="menu-hide">Window</span>
      </div>
      <div class="menu-right">
        <button class="music-btn" id="musicBtn" hidden aria-label="Pause music">
          <span class="eq"><i></i><i></i><i></i><i></i></span>
          <span class="music-title" id="musicTitle"></span>
        </button>
        <span class="menu-hide" aria-hidden="true">
          <svg width="16" height="12" viewBox="0 0 16 12"><path fill="currentColor" d="M8 11.5 5.6 9a3.4 3.4 0 0 1 4.8 0L8 11.5ZM3.4 6.8a6.5 6.5 0 0 1 9.2 0l-1.1 1.1a5 5 0 0 0-7 0L3.4 6.8ZM1.2 4.6a9.6 9.6 0 0 1 13.6 0l-1.1 1.1a8 8 0 0 0-11.4 0L1.2 4.6Z"/></svg>
        </span>
        <span class="menu-hide battery" aria-hidden="true"><span></span></span>
        <span id="menuClock"></span>
      </div>
    </header>

    <div id="windows"></div>

    <nav class="dock" id="dock" aria-label="Dock"></nav>
  </main>

  <script src="content.js"></script>
  <script src="app.js"></script>
</body>
</html>
